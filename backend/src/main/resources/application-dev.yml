spring:
  datasource:
    url: jdbc:h2:file:./hrms-h2-data;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  mail:
    # Leave a placeholder SMTP so the app still boots without real creds;
    # emails will just fail and get logged to email_logs as FAILED, which is fine for local testing.
    host: localhost
    port: 1025
    username: dev
    password: dev
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

app:
  jwt:
    secret: "dev-only-secret-do-not-use-in-production-32bytes-min"

logging:
  level:
    com.hrms: DEBUG
