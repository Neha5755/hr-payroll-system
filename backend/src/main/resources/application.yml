server:
  port: 8080

spring:
  application:
    name: hr-payroll-system

  datasource:
    url: jdbc:postgresql://localhost:5432/hrms_db
    username: ${DB_USERNAME:hrms_user}
    password: ${DB_PASSWORD:hrms_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate        # schema is managed by Flyway migrations
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:hr-noreply@example.com}
    password: ${MAIL_PASSWORD:changeme}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  jwt:
    secret: ${JWT_SECRET:CHANGE_THIS_TO_A_LONG_RANDOM_BASE64_SECRET_MIN_256_BITS}
    access-token-expiry-ms: 3600000        # 1 hour
    refresh-token-expiry-ms: 604800000     # 7 days
  mail:
    from-address: ${MAIL_FROM:hr-noreply@example.com}
    from-name: "HR Payroll Team"
    payslip-subject-template: "Your Payslip for %s - %s"
  payroll:
    # Cron: run at 02:00 on the 1st of every month for the previous month's payroll
    auto-run-cron: "0 0 2 1 * *"
  storage:
    payslip-dir: ./generated-payslips
  cors:
    allowed-origins: "http://localhost:3000"

logging:
  level:
    com.hrms: INFO
    org.springframework.security: WARN
